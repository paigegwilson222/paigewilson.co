<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Paige Wilson</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* HEADER */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 32px;
    }

    .name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-decoration: none;
      color: inherit;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: inherit;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    nav a:hover {
      opacity: 0.5;
    }

    /* PORTFOLIO */

    main {
      padding: 55px 32px 100px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 90px 32px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .project {
      cursor: pointer;
    }

    .placeholder {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #f2f2f2;
    }

    .project:nth-child(3n) .placeholder {
      aspect-ratio: 3 / 4;
    }

    .project-info {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 12px;
      font-size: 12px;
    }

    .status {
      color: #777;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      header {
        padding: 22px 18px;
      }

      nav {
        gap: 15px;
      }

      main {
        padding: 35px 18px 70px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 60px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="name" href="/">PAIGE WILSON</a>

    <nav>
      <a href="#">WORK</a>
      <a href="#">ABOUT</a>
      <a href="#">CONTACT</a>
    </nav>
  </header>

  <main>

    <div class="gallery">

      <div class="project">
        <div class="placeholder"></div>
        <div class="project-info">
          <span>UNTITLED 01</span>
          <span class="status">AVAILABLE</span>
        </div>
      </div>

      <div class="project">
        <div class="placeholder"></div>
        <div class="project-info">
          <span>UNTITLED 02</span>
          <span class="status">AVAILABLE</span>
        </div>
      </div>

      <div class="project">
        <div class="placeholder"></div>
        <div class="project-info">
          <span>UNTITLED 03</span>
          <span class="status">SOLD</span>
        </div>
      </div>

      <div class="project">
        <div class="placeholder"></div>
        <div class="project-info">
          <span>UNTITLED 04</span>
          <span class="status">AVAILABLE</span>
        </div>
      </div>

    </div>

  </main>

</body>
</html>
